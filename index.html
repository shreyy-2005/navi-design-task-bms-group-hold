ick=\"{{seat.pick}}\" disabled=\"{{seat.sold}}\" aria-label=\"{{seat.aria}}\" style=\"{{seat.style}}\">{{seat.label}}<\/button>\n              <\/sc-for>\n            <\/div>\n          <\/div>\n        <\/sc-for>\n      <\/div>\n    <\/sc-for>\n    <div style=\"margin-top:4px;display:flex;flex-direction:column;align-items:center;gap:6px\">\n      <div style=\"width:240px;height:6px;border-radius:3px;background:#B9C3DA\"><\/div>\n      <span style=\"font-size:12px;color:#4A4E5C\">Screen this way<\/span>\n    <\/div>\n  <\/div>\n\n  <div style=\"padding:8px 20px;display:flex;justify-content:center;gap:16px;font-size:12px;color:#4A4E5C\">\n    <span style=\"display:flex;align-items:center;gap:6px\"><span style=\"width:14px;height:14px;border-radius:4px;border:1.5px solid #17803F;background:#FFFFFF\"><\/span>Available<\/span>\n    <span style=\"display:flex;align-items:center;gap:6px\"><span style=\"width:14px;height:14px;border-radius:4px;background:#17803F\"><\/span>Selected<\/span>\n    <span style=\"display:flex;align-items:center;gap:6px\"><span style=\"width:14px;height:14px;border-radius:4px;background:#E4E6EC\"><\/span>Sold<\/span>\n    <span style=\"display:flex;align-items:center;gap:6px\"><span style=\"width:14px;height:14px;border-radius:4px;border:1.5px dashed #B8860B;background:#FFF4D6\"><\/span>Held<\/span>\n  <\/div>\n  <\/div><!-- /scroll -->\n\n  <div style=\"padding:12px 20px 20px;background:#FFFFFF;border-top:1px solid #D5D8E0;display:flex;flex-direction:column;gap:10px\">\n    <span style=\"font-size:13px;color:#4A4E5C\">{{selText}}<\/span>\n    <sc-if value=\"{{canHold}}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"display:flex;gap:12px\">\n        <a href=\"HoldUpgrade.dc.html\" onClick=\"{{startHold}}\" style=\"flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;height:56px;border-radius:12px;border:2px solid #C72C4E;background:#FFFFFF;color:#C72C4E;font-size:16px;font-weight:700\">Hold seats<span style=\"font-size:12px;font-weight:500\">Friends pay their share<\/span><\/a>\n        <a href=\"Confirm.dc.html\" onClick=\"{{startSolo}}\" style=\"flex:1;display:flex;align-items:center;justify-content:center;height:56px;border-radius:12px;background:#C72C4E;color:#FFFFFF;font-size:16px;font-weight:700\">{{payText}}<\/a>\n      <\/div>\n    <\/sc-if>\n    <sc-if value=\"{{soloPay}}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"display:flex;gap:12px\">\n        <button onClick=\"{{tapNote}}\" aria-disabled=\"true\" style=\"flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;height:56px;border-radius:12px;border:2px solid #D5D8E0;background:#E4E6EC;color:#6B6F7C;font-size:16px;font-weight:700;font-family:inherit;cursor:not-allowed\">Hold seats<span style=\"font-size:12px;font-weight:500\">{{holdSub}}<\/span><\/button>\n        <a href=\"Confirm.dc.html\" onClick=\"{{startSolo}}\" style=\"flex:1;display:flex;align-items:center;justify-content:center;height:56px;border-radius:12px;background:#C72C4E;color:#FFFFFF;font-size:16px;font-weight:700\">{{payText}}<\/a>\n      <\/div>\n      <sc-if value=\"{{showNote}}\" hint-placeholder-val=\"{{ false }}\">\n        <span style=\"font-size:13px;font-weight:700;color:#8A1F11\">{{noteText}}<\/span>\n        <sc-if value=\"{{cooling}}\" hint-placeholder-val=\"{{ false }}\">\n          <button onClick=\"{{resetCool}}\" style=\"align-self:flex-start;border:0;background:none;padding:4px 0;color:#4A4E5C;font-size:12px;font-weight:700;cursor:pointer;text-decoration:underline\">Reset cooldown (demo)<\/button>\n        <\/sc-if>\n      <\/sc-if>\n    <\/sc-if>\n    <sc-if value=\"{{noSel}}\" hint-placeholder-val=\"{{ false }}\">\n      <span style=\"display:flex;align-items:center;justify-content:center;height:52px;border-radius:12px;background:#E4E6EC;color:#4A4E5C;font-size:16px;font-weight:700\">Select seats<\/span>\n    <\/sc-if>\n  <\/div>\n<\/div>", "code": "\nconst SOLD = { A:[1,2,11,12], B:[1,2,3,15,16], C:[1,2,6,7,8,14,15,16], D:[1,2,10,11,16], E:[1,2,3,5,6,13,14], F:[1,2,3,14,15], G:[1,2,6,7,8,16], H:[1,10,11,15,16], I:[1,2,3,16], J:[1,2,8,9,15,16], K:[1,2,6,7,13,14,15], L:[1,3,4,7,8,10], M:[1,2,3,14,15] };\nconst GH = {\n  t0: () => { let t = Date.now(); try { const v = parseInt(window.localStorage.getItem('gh_t0'), 10); if (v > 0 && t - v < 7200000) { t = v; } else { window.localStorage.setItem('gh_t0', String(t)); } } catch (e) { } return t; },\n  r5: (ms) => Math.ceil(ms / 300000) * 300000,\n  early: () => GH.r5(GH.t0() + 12 * 3600000),\n  late: () => GH.r5(GH.t0() + 14 * 3600000),\n  show: () => { let v = 0; try { v = parseInt(window.localStorage.getItem('gh_show'), 10); } catch (e) { } return v > 0 ? v : GH.late(); },\n  hm: (ms) => { const d = new Date(ms); const h = d.getHours() % 12 === 0 ? 12 : d.getHours() % 12; const m = d.getMinutes(); return (h < 10 ? '0' : '') + h + ':' + (m < 10 ? '0' : '') + m + ' ' + (d.getHours() >= 12 ? 'PM' : 'AM'); },\n  day: (ms) => { const d = new Date(ms); return ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'][d.getDay()] + ', ' + d.getDate() + ' ' + ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'][d.getMonth()]; },\n  dayY: (ms) => GH.day(ms) + ', ' + new Date(ms).getFullYear(),\n  holdEnd: () => { let e = 0; try { e = parseInt(window.localStorage.getItem('gh_end'), 10); } catch (x) { } return e > Date.now() ? e : GH.t0() + 3600000 - 1000; }\n};\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    let n = 2;\n    try {\n      const v = parseInt(window.localStorage.getItem('gh_seat_count'), 10);\n      if (v >= 1 && v <= 10) { n = v; }\n    } catch (e) { n = 2; }\n    let ids = [];\n    const rowsList = 'FHGIJK';\n    const isS = (L, c) => (SOLD[L] || []).indexOf(c) >= 0;\n    const starts = [8, 9, 4, 5, 6, 7, 10, 11, 12];\n    for (let r = 0; r < rowsList.length && ids.length < n; r++) {\n      for (let k = 0; k < starts.length && ids.length < n; k++) {\n        const c0 = starts[k];\n        if (c0 + n - 1 > 16) { continue; }\n        let ok = true;\n        for (let c = c0; c < c0 + n; c++) { if (isS(rowsList.charAt(r), c)) { ok = false; } }\n        if (ok) { for (let c = c0; c < c0 + n; c++) { ids.push(rowsList.charAt(r) + c); } }\n      }\n    }\n    this.state = { count: n, sel: ids, note: false, early: false };\n  }\n  renderVals() {\n    const count = this.state.count;\n    const sel = this.state.sel;\n    const letters = 'ABCDEFGHIJKLM';\n    const defs = [\n      { name: 'RECLINER ROWS', price: 790, rows: ['A'], cols: 12 },\n      { name: 'PRIME PLUS ROWS', price: 410, rows: ['B', 'C', 'D', 'E'], cols: 16 },\n      { name: 'PRIME ROWS', price: 340, rows: ['F', 'G', 'H', 'I', 'J', 'K'], cols: 16 },\n      { name: 'CLASSIC ROWS', price: 320, rows: ['L', 'M'], cols: 16 }\n    ];\n    const isSold = (ri, c) => (SOLD['ABCDEFGHIJKLM'.charAt(ri)] || []).indexOf(c) >= 0;\n    const priceOf = (L) => {\n      let p = 0;\n      defs.forEach((d) => { if (d.rows.indexOf(L) >= 0) { p = d.price; } });\n      return p;\n    };\n    const toggle = (key) => {\n      const cur = this.state.sel.slice();\n      const at = cur.indexOf(key);\n      if (at >= 0) {\n        cur.splice(at, 1);\n      } else {\n        if (cur.length >= 10) { cur.shift(); }\n        cur.push(key);\n      }\n      this.setState({ sel: cur, note: false });\n    };\n    const base = 'width:18px;height:18px;border-radius:4px;font-size:10px;padding:0;';\n    const tiers = defs.map((t) => ({\n      title: '₹' + t.price + '  ' + t.name,\n      rows: t.rows.map((L) => {\n        const ri = letters.indexOf(L);\n        const seats = [];\n        for (let c = 1; c <= t.cols; c++) {\n          const key = L + c;\n          const on = sel.indexOf(key) >= 0;\n          const sold = !on && isSold(ri, c);\n          const held = L === 'B' && c >= 5 && c <= 10;\n          let style = base + 'border:1.5px solid #17803F;background:#FFFFFF;color:#1B1D26;cursor:pointer;';\n          let aria = 'Seat ' + key + ', available';\n          if (on) { style = base + 'border:1.5px solid #17803F;background:#17803F;color:#FFFFFF;cursor:pointer;'; aria = 'Seat ' + key + ', selected'; }\n          if (sold) { style = base + 'border:none;background:#E4E6EC;color:transparent;cursor:default;'; aria = 'Seat ' + key + ', sold'; }\n          if (held) { style = base + 'border:1.5px dashed #B8860B;background:#FFF4D6;color:#7A5200;cursor:default;'; aria = 'Seat ' + key + ', held by another group till ' + GH.hm(Date.now() + 19 * 60000); }\n          seats.push({ label: String(c), sold: sold || held, style: style, aria: aria, pick: () => toggle(key) });\n        }\n        return { label: L, seats: seats };\n      })\n    }));\n    let total = 0;\n    sel.forEach((k) => { total += priceOf(k.charAt(0)); });\n    try {\n      window.localStorage.setItem('gh_seats', String(sel.length));\n      window.localStorage.setItem('gh_total', String(total));\n      const byRow = {}; sel.forEach((k) => { const r = k.charAt(0); (byRow[r] = byRow[r] || []).push(parseInt(k.slice(1), 10)); });\n      const parts = Object.keys(byRow).sort().map((r) => { const a = byRow[r].sort((x, y) => x - y); let consec = true; for (let i = 1; i < a.length; i++) { if (a[i] !== a[i - 1] + 1) { consec = false; } } return a.length > 2 && consec ? r + a[0] + ' to ' + r + a[a.length - 1] : a.map((x) => r + x).join(', '); });\n      window.localStorage.setItem('gh_labels', parts.join(', '));\n    } catch (e) { }\n    const early = this.state.early;\n    const showMs = early ? GH.early() : GH.late();\n    const blocked = showMs - Date.now() < 6 * 3600000;\n    let cool = 0; try { const ls = window.localStorage; cool = parseInt(ls.getItem('gh_cool'), 10) || 0; const he = parseInt(ls.getItem('gh_end'), 10) || 0; if (ls.getItem('gh_paid') === '1' && ls.getItem('gh_booked') !== '1' && he > 0 && he <= Date.now()) { cool = Math.max(cool, he + 3600000); ls.setItem('gh_cool', String(cool)); } } catch (e) { }\n    const cooling = cool > Date.now();\n    try { window.localStorage.setItem('gh_show', String(showMs)); } catch (e) { }\n    const canHold = sel.length >= 4 && sel.length <= 8 && !blocked && !cooling;\n    const chip = 'flex:0 0 110px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0;border-radius:6px;border:1.5px solid #17803F;font-size:14px;font-family:inherit;cursor:pointer;';\n    return {\n      tiers: tiers,\n      hasSel: sel.length > 0,\n      noSel: sel.length === 0,\n      countText: sel.length + (sel.length === 1 ? ' Ticket' : ' Tickets'),\n      selText: sel.length === 0 ? 'No seats selected' : sel.join(', '),\n      totalText: '₹' + total,\n      payText: 'Pay ₹' + total,\n      canHold: canHold,\n      earlyStyle: chip + (early ? 'background:#17803F;color:#FFFFFF;font-weight:700;' : 'background:#FFFFFF;color:#1B1D26;font-weight:500;'),\n      lateStyle: chip + (early ? 'background:#FFFFFF;color:#1B1D26;font-weight:500;' : 'background:#17803F;color:#FFFFFF;font-weight:700;'),\n      pickEarly: () => { this.setState({ early: true }); },\n      pickLate: () => { this.setState({ early: false }); },\n      holdSub: blocked ? 'Not available' : (cooling ? 'Try again later' : 'For 4 to 8 seats'),\n      dayText: GH.day(showMs),\n      earlyT: GH.hm(GH.early()),\n      lateT: GH.hm(GH.late()),\n      heldT: GH.hm(Date.now() + 19 * 60000),\n      cooling: cooling,\n      resetCool: () => { try { window.localStorage.removeItem('gh_cool'); window.localStorage.setItem('gh_paid', '0'); window.localStorage.removeItem('gh_end'); } catch (e) { } this.setState({ note: false }); },\n      showNote: this.state.note || blocked || cooling,\n      noteText: blocked ? 'Hold is not available when the show starts in under 6 hours.' : (cooling ? 'A hold of yours ended without a booking. You can hold again at ' + GH.hm(cool) + '.' : 'Hold is only available for 4 to 8 seats.'),\n      tapNote: () => { this.setState({ note: true }); },\n      soloPay: sel.length > 0 && !canHold,\n      startSolo: () => { try { window.localStorage.setItem('gh_mode', 'solo'); } catch (e) { } },\n      startHold: () => {\n        try { window.localStorage.setItem('gh_paid', '0'); } catch (e) { }\n      }\n    };\n  }\n}\n"}, "HoldUpgrade": {"tpl": "<div style=\"width:390px;height:844px;box-sizing:border-box;display:flex;flex-direction:column;background:#F4F5F8;color:#1B1D26;font-family:'DM Sans',system-ui,sans-serif;overflow:hidden\">\n  <div style=\"padding:16px 20px;display:flex;align-items:center;gap:12px\">\n    <a href=\"Seats.dc.html\" aria-label=\"Back to seat map\" style=\"width:44px;height:44px;border-radius:22px;display:flex;align-items:center;justify-content:center;background:#FFFFFF;border:1px solid #D5D8E0\">\n      <svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#1B1D26\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M15 6l-6 6 6 6\"/><\/svg>\n    <\/a>\n    <span style=\"font-size:18px;font-weight:700\">Choose hold time<\/span>\n  <\/div>\n\n  <div style=\"padding:0 20px 14px;display:flex;flex-direction:column;gap:14px;flex:1 1 auto;min-height:0;overflow-y:auto\">\n    <div style=\"font-size:14px;color:#4A4E5C\">Hold your seats for a while and invite friends to pay their share. Longer holds cost a higher deposit.<\/div>\n\n    <sc-for list=\"{{options}}\" as=\"o\" hint-placeholder-count=\"3\">\n      <button onClick=\"{{o.pick}}\" aria-pressed=\"{{o.on}}\" style=\"text-align:left;display:flex;justify-content:space-between;align-items:center;padding:16px;border-radius:12px;cursor:pointer;{{o.style}}\">\n        <span style=\"display:flex;flex-direction:column;gap:2px\">\n          <span style=\"font-size:16px;font-weight:700\">{{o.title}}<\/span>\n          <span style=\"font-size:13px;color:#4A4E5C\">{{o.ends}}<\/span>\n        <\/span>\n        <span style=\"font-size:16px;font-weight:700\">{{o.fee}}<\/span>\n      <\/button>\n    <\/sc-for>\n\n    <div style=\"background:#FFFFFF;border:1px solid #D5D8E0;border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px\">\n      <div style=\"display:flex;justify-content:space-between;font-size:15px\">\n        <span style=\"color:#4A4E5C\">Hold deposit<\/span>\n        <span style=\"font-weight:500\">{{pctText}}<\/span>\n      <\/div>\n      <div style=\"height:1px;background:#D5D8E0\"><\/div>\n      <div style=\"display:flex;justify-content:space-between;font-size:16px;font-weight:700\">\n        <span>Pay now<\/span>\n        <span>{{nowText}}<\/span>\n      <\/div>\n      <span style=\"font-size:13px;color:#4A4E5C\">Your deposit counts toward the final bill when you book. Seats you have not booked by the end time go back on sale, and you lose the deposit for those seats. If friends have not paid with 10 minutes left, you pay for their seats, or auto-pay does it if you turn it on.<\/span>\n    <\/div>\n\n    <label style=\"display:flex;gap:12px;align-items:flex-start;font-size:14px;cursor:pointer\">\n      <input type=\"checkbox\" onChange=\"{{toggleAck}}\" style=\"width:24px;height:24px;margin:0;flex:none\">\n      <span>I understand that if I cancel the hold or it ends, I lose the deposit.<\/span>\n    <\/label>\n  <\/div>\n\n  <div style=\"padding:12px 20px 20px;background:#FFFFFF;border-top:1px solid #D5D8E0\">\n    <sc-if value=\"{{ack}}\" hint-placeholder-val=\"{{ true }}\">\n      <a href=\"Hold.dc.html\" onClick=\"{{pay}}\" style=\"display:flex;align-items:center;justify-content:center;height:52px;border-radius:12px;background:#C72C4E;color:#FFFFFF;font-size:16px;font-weight:700\">{{payLabel}}<\/a>\n    <\/sc-if>\n    <sc-if value=\"{{noAck}}\" hint-placeholder-val=\"{{ false }}\">\n      <span style=\"display:flex;align-items:center;justify-content:center;height:52px;border-radius:12px;background:#E4E6EC;color:#4A4E5C;font-size:16px;font-weight:700\">Tick the box to continue<\/span>\n    <\/sc-if>\n    <div style=\"margin-top:8px;font-size:12px;color:#4A4E5C;text-align:center\">Design concept. Percentages are illustrative. No real payment.<\/div>\n  <\/div>\n<\/div>", "code": "\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    let total = 2040;\n    try {\n      const t = parseInt(window.localStorage.getItem('gh_total'), 10);\n      if (t > 0) { total = t; }\n    } catch (e) { }\n    this.total = total;\n    this.state = { hrs: 1, ack: false };\n  }\n  renderVals() {\n    const pct = { 1: 15, 2: 20, 3: 25 };\n    const fmt = (ms) => {\n      const d = new Date(ms);\n      const h12 = d.getHours() % 12 === 0 ? 12 : d.getHours() % 12;\n      const mm = d.getMinutes();\n      return h12 + ':' + (mm < 10 ? '0' + mm : mm) + (d.getHours() >= 12 ? ' PM' : ' AM');\n    };\n    const t0 = Date.now();\n    const ends = {};\n    [1, 2, 3].forEach((k) => { ends[k] = 'Offer remains till ' + fmt(t0 + k * 3600000); });\n    const hrs = this.state.hrs;\n    const deposit = Math.round(this.total * pct[hrs] / 100);\n    const now = deposit;\n    const options = [1, 2, 3].map((k) => ({\n      title: k + (k === 1 ? ' hour' : ' hours'),\n      ends: ends[k],\n      fee: pct[k] + '%',\n      on: hrs === k,\n      style: hrs === k ? 'border:2px solid #C72C4E;background:#FDECEF;' : 'border:1px solid #D5D8E0;background:#FFFFFF;',\n      pick: () => { this.setState({ hrs: k }); }\n    }));\n    return {\n      options: options,\n            depositText: '₹' + deposit,\n      pctText: pct[hrs] + '% of tickets (₹' + this.total + ')',\n      nowText: '₹' + now,\n      payLabel: 'Pay ₹' + now + ' (demo)',\n      ack: this.state.ack,\n      noAck: !this.state.ack,\n      toggleAck: () => { this.setState({ ack: !this.state.ack }); },\n      pay: () => {\n        try {\n          window.localStorage.setItem('gh_paid', '1');\n          window.localStorage.setItem('gh_booked', '0');\n          window.localStorage.setItem('gh_len', String(hrs));\n          window.localStorage.setItem('gh_pct', String(pct[hrs]));\n          window.localStorage.setItem('gh_end', String(Date.now() + hrs * 3600000));\n          const seatsN = parseInt(window.localStorage.getItem('gh_seats'), 10) || 6;\n          const slotsN = Math.max(1, seatsN - 1);\n          const share = 0.5 + Math.random() * 0.3;\n          const fpN = Math.max(1, Math.min(slotsN - 1, Math.round(slotsN * share)));\n          window.localStorage.setItem('gh_fp', String(fpN));\n          window.localStorage.setItem('gh_removed', '0');\n          window.localStorage.setItem('gh_fpaid', String(fpN));\n        } catch (e) { }\n      }\n    };\n  }\n}\n"}, "Hold": {"tpl": "<div style=\"width:390px;height:844px;box-sizing:border-box;display:flex;flex-direction:column;background:#F4F5F8;color:#1B1D26;font-family:'DM Sans',system-ui,sans-serif;overflow:hidden;position:relative\">\n  <div style=\"padding:16px 20px;display:flex;align-items:center;gap:12px\">\n    <a href=\"Main.dc.html\" aria-label=\"Back to home\" style=\"width:44px;height:44px;border-radius:22px;display:flex;align-items:center;justify-content:center;background:#FFFFFF;border:1px solid #D5D8E0\">\n      <svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#1B1D26\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M15 6l-6 6 6 6\"/><\/svg>\n    <\/a>\n    <div style=\"display:flex;flex-direction:column\">\n      <span style=\"font-size:18px;font-weight:700\">Your seats are held<\/span>\n      <span style=\"font-size:13px;color:#4A4E5C\">Night Ferry · {{headerWhen}}<\/span>\n    <\/div>\n  <\/div>\n\n  <div style=\"padding:0 20px 12px;display:flex;flex-direction:column;gap:14px;flex:1 1 auto;overflow-y:auto\">\n    <sc-if value=\"{{ended}}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"padding:12px 14px;border-radius:12px;background:#FDECEA;border:1px solid #F0B8B3;font-size:14px;color:#8A1C14;font-weight:500\">Hold ended. The seats went back on sale and your deposit is not refunded. Friends who paid are refunded in full.<\/div>\n    <\/sc-if>\n    <div style=\"background:#FFFFFF;border:1px solid #D5D8E0;border-radius:12px;padding:16px;display:flex;align-items:center;justify-content:space-between;gap:12px\">\n      <div style=\"display:flex;flex-direction:column;gap:2px\">\n        <span style=\"font-size:13px;color:#4A4E5C\">{{holdLabel}}<\/span>\n        <span style=\"font-size:34px;font-weight:700;color:#C72C4E;font-variant-numeric:tabular-nums\">{{clock}}<\/span>\n      <\/div>\n      <div style=\"display:flex;flex-direction:column;align-items:flex-end;gap:2px\">\n        <span style=\"font-size:15px;font-weight:700\">{{seatsText}}<\/span>\n        <span style=\"font-size:13px;color:#4A4E5C\">{{totalText}}<\/span>\n      <\/div>\n    <\/div>\n\n    <sc-if value=\"{{live}}\" hint-placeholder-val=\"{{ true }}\">\n    <div style=\"padding:12px 14px;border-radius:12px;background:#E3F3E9;font-size:14px;color:#0F5F2F;font-weight:500\">{{offerText}}<\/div>\n    <sc-if value=\"{{refundOver}}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"padding:12px 14px;border-radius:12px;background:#FFF4D6;border:1px solid #E8D38A;font-size:14px;color:#4A3B00;font-weight:500\">Refund window is over. Cancelling now loses your deposit.<\/div>\n    <\/sc-if>\n\n    <sc-if value=\"{{paid}}\" hint-placeholder-val=\"{{ true }}\">\n    <div style=\"background:#FFFFFF;border:1px solid #D5D8E0;border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px\">\n      <span style=\"font-size:15px;font-weight:700\">Friends pay their own share<\/span>\n      <div style=\"display:flex;align-items:baseline;gap:8px;flex-wrap:wrap\"><span style=\"font-size:34px;font-weight:700;letter-spacing:-0.5px;line-height:1.1\">{{shareAmt}}<\/span><span style=\"font-size:14px;font-weight:500;color:#4A4E5C\">per friend · 1 seat<\/span><\/div>\n      <span style=\"font-size:14px;color:#4A4E5C\">{{slotsLine}}<\/span>\n      <div style=\"display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:8px;background:#F4F5F8;border:1px dashed #D5D8E0;font-size:13px;color:#4A4E5C\">book-your-show.example/g/K7Q2-NF<\/div>\n      <button onClick=\"{{sendLink}}\" style=\"height:52px;border:0;border-radius:12px;background:#17803F;color:#FFFFFF;font-size:16px;font-weight:700;cursor:pointer\">{{sendLabel}}<\/button>\n      <sc-if value=\"{{sent}}\" hint-placeholder-val=\"{{ false }}\">\n        <span style=\"font-size:13px;color:#0F5F2F;font-weight:700\">Link copied. Paste it in WhatsApp.<\/span>\n      <\/sc-if>\n    <\/div>\n    <\/sc-if>\n\n    <div style=\"background:#FFFFFF;border:1px solid #D5D8E0;border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px\">\n      <div style=\"display:flex;justify-content:space-between;align-items:center\">\n        <span style=\"font-size:15px;font-weight:700\">Who has paid<\/span>\n        <span style=\"font-size:13px;color:#4A4E5C\">{{paidSummary}}<\/span>\n      <\/div>\n      <sc-for list=\"{{friends}}\" as=\"f\" hint-placeholder-count=\"4\">\n        <div style=\"display:flex;flex-direction:column;gap:6px\">\n          <div style=\"display:flex;justify-content:space-between;align-items:center;font-size:14px\">\n            <span>{{f.name}}<\/span>\n            <span style=\"padding:3px 10px;border-radius:12px;font-size:12px;font-weight:700;{{f.style}}\">{{f.status}}<\/span>\n          <\/div>\n          <sc-if value=\"{{f.pending}}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"display:flex;align-items:center;gap:8px;padding-top:2px\">\n              <button onClick=\"{{f.nudge}}\" aria-label=\"{{f.nudgeLabel}}\" title=\"{{f.nudgeLabel}}\" style=\"{{f.nudgeStyle}}\"><svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"{{f.bellStroke}}\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9\"/><path d=\"M10.300 21a1.940 1.940 0 0 0 3.400 0\"/><\/svg><\/button>\n              <button onClick=\"{{f.cash}}\" style=\"height:32px;padding:0 14px;border-radius:16px;border:1px solid #D5D8E0;background:#F4F5F8;color:#1B1D26;font-family:inherit;font-size:13px;font-weight:500;cursor:pointer\">Paid in cash<\/button>\n              <sc-if value=\"{{f.canRemove}}\" hint-placeholder-val=\"{{ false }}\">\n                <button onClick=\"{{f.remove}}\" style=\"height:32px;padding:0 14px;border-radius:16px;border:1px solid #D5D8E0;background:#FFFFFF;color:#4A4E5C;font-family:inherit;font-size:13px;font-weight:500;cursor:pointer\">Remove<\/button>\n              <\/sc-if>\n            <\/div>\n          <\/sc-if>\n          <sc-if value=\"{{f.cashDone}}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"display:flex;align-items:center;justify-content:space-between;padding-top:2px\">\n              <span style=\"font-size:13px;color:#4A4E5C\">Marked as paid in cash<\/span>\n              <button onClick=\"{{f.undo}}\" style=\"height:32px;padding:0 14px;border-radius:16px;border:1.5px solid #C72C4E;background:#FFFFFF;color:#C72C4E;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer\">Undo<\/button>\n            <\/div>\n          <\/sc-if>\n        <\/div>\n      <\/sc-for>\n      <sc-if value=\"{{hasMore}}\" hint-placeholder-val=\"{{ true }}\">\n        <button onClick=\"{{toggleMore}}\" style=\"align-self:flex-start;border:0;background:none;padding:8px 0;color:#C72C4E;font-size:14px;font-weight:700;cursor:pointer\">{{moreText}}<\/button>\n      <\/sc-if>\n      <div style=\"font-size:13px;color:#4A4E5C\">Only you see this list. In the last 10 minutes, if auto-pay is off, you can remove friends who have not paid and let their seats go.<\/div>\n      <div style=\"display:flex;justify-content:space-between;align-items:center;padding-top:8px;border-top:1px solid #D5D8E0;font-size:13px\">\n        <span style=\"color:#4A4E5C\">We will notify you 15 min before it ends.<\/span>\n      <\/div>\n    <\/div>\n\n    <div style=\"background:#FFFFFF;border:1px solid #D5D8E0;border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px\">\n      <div style=\"display:flex;justify-content:space-between;align-items:center;gap:12px\">\n        <span style=\"font-size:15px;font-weight:700\">Auto-pay for unpaid seats<\/span>\n        <button onClick=\"{{toggleAuto}}\" role=\"switch\" aria-checked=\"{{auto}}\" aria-label=\"Auto-pay\" style=\"{{autoStyle}}\"><span style=\"{{knobStyle}}\"><\/span><\/button>\n      <\/div>\n      <span style=\"font-size:14px;color:#4A4E5C\">{{autoText}}<\/span>\n    <\/div>\n\n    <div style=\"padding:10px 14px;border-radius:12px;background:#FFF4D6;border:1px solid #E8D38A;font-size:13px;color:#4A3B00\">Design concept. No real payment is taken in this prototype.<\/div>\n    <sc-if value=\"{{jumpShow}}\" hint-placeholder-val=\"{{ true }}\">\n      <button onClick=\"{{jump}}\" style=\"height:40px;border-radius:10px;border:1px dashed #4A4E5C;background:transparent;color:#4A4E5C;font-family:inherit;font-size:13px;cursor:pointer\">{{jumpText}}<\/button>\n    <\/sc-if>\n    <\/sc-if>\n  <\/div>\n\n  <sc-if value=\"{{alert}}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position:absolute;left:12px;right:12px;top:12px;z-index:5;background:#FFFFFF;border:1px solid #D5D8E0;border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px;box-shadow:0 8px 24px rgba(27,29,38,0.18)\">\n      <span style=\"font-size:12px;color:#4A4E5C\">Book your show · now (demo notification)<\/span>\n      <span style=\"font-size:16px;font-weight:700\">Hold ends in 15 minutes<\/span>\n      <span style=\"font-size:14px;color:#4A4E5C\">{{alertText}}<\/span>\n      <span style=\"font-size:13px;color:#4A3B00;background:#FFF4D6;padding:8px 10px;border-radius:8px\">{{loseText}}<\/span>\n      <a href=\"Confirm.dc.html\" onClick=\"{{goBook}}\" style=\"display:fle if (q > 0) { pct = q; }\n    } catch (e) { }\n    this.cfg = { mode: mode, n: n, total: total, paid: paid, pct: pct };\n    this.state = { all: false };\n  }\n  renderVals() {\n    const c = this.cfg;\n    const money = (v) => '₹' + v.toFixed(2).replace(/\\.00$/, '');\n    if (c.mode !== 'hold') {\n      return {\n        whenText: GH.dayY(GH.show()) + ' | ' + GH.hm(GH.show()),\n        isHold: false,\n        titleText: 'Confirm booking',\n        seatLine: 'Prime · F9, F10',\n        countText: '2',\n        needText: '',\n        rows: [\n          { label: 'Ticket(s) price', value: '₹680.00', style: '' },\n          { label: 'Convenience fees', value: '₹80.24', style: '' }\n        ],\n        totalLabel: 'Order total',\n        totalText: '₹760.24',\n        payLabel: 'Pay (demo)',\n        payHref: 'Payment.dc.html',\n        allPaid: false,\n        toggleAll: () => { },\n        demoText: ''\n      };\n    }\n    const n = c.n;\n    let fp = 2; try { fp = parseInt(window.localStorage.getItem('gh_fpaid'), 10) || 2; } catch (e) { }\n    let removed = 0; try { removed = parseInt(window.localStorage.getItem('gh_removed'), 10) || 0; } catch (e6) { }\n    const seatsN = n - removed;\n    const friendsPaid = Math.min(fp, seatsN - 1);\n    const rem = seatsN - friendsPaid;\n    const unpaidFriends = rem - 1;\n    const perSeat = c.total / n;\n    const ownTix = Math.round(perSeat);\n    const tix = Math.round(perSeat * rem);\n    const fee = Math.round(tix * 0.118);\n    const deposit = Math.round(c.total * c.pct / 100);\n    const owed = tix + fee;\n    const due = Math.max(0, owed - deposit);\n    const refund = Math.max(0, deposit - owed);\n    const rows = [\n      { label: seatsN + ' seats held', value: '₹' + Math.round(perSeat * seatsN), style: '' },\n      { label: 'Paid by friends (' + friendsPaid + ' seat' + (friendsPaid === 1 ? '' : 's') + ')', value: 'Done', style: 'color:#0F5F2F;font-weight:700;' },\n      { label: 'Your seat (1)', value: '₹' + ownTix, style: '' }\n    ];\n    if (unpaidFriends > 0) { rows.push({ label: 'Friends’ unpaid seats (' + unpaidFriends + ')', value: '₹' + (tix - ownTix), style: '' }); }\n    rows.push({ label: 'Convenience fees', value: '₹' + fee, style: '' });\n    if (deposit > 0) { rows.push({ label: 'Hold deposit already paid', value: '-₹' + deposit, style: 'color:#0F5F2F;' }); }\n    if (refund > 0) { rows.push({ label: 'Extra deposit back to your UPI', value: '+₹' + refund, style: 'color:#0F5F2F;font-weight:700;' }); }\n    return {\n      whenText: GH.dayY(GH.show()) + ' | ' + GH.hm(GH.show()),\n      isHold: true,\n      titleText: 'Confirm booking',\n      seatLine: 'Prime · ' + seatsN + ' seats held together',\n      countText: String(seatsN),\n      needText: refund > 0 ? 'Everyone has paid. Your deposit covers your own seat and ₹' + refund + ' goes back to your UPI account.' : (unpaidFriends > 0 ? 'Your hold deposit is already counted. Pay the rest, including ' + unpaidFriends + (unpaidFriends === 1 ? ' friend’s seat' : ' friends’ seats') + ', to confirm all ' + seatsN + '.' : 'Everyone else has paid. Your hold deposit is already counted toward your seat.'),\n      rows: rows,\n      totalLabel: 'You pay now',\n      totalText: '₹' + due,\n      payHref: due > 0 ? 'Payment.dc.html' : 'PaymentDone.dc.html',\n      payLabel: due > 0 ? 'Pay ₹' + due + ' (demo)' : 'Confirm booking (demo)',\n      allPaid: this.state.all,\n      toggleAll: () => { const v = !this.state.all; try { window.localStorage.setItem('gh_fpaid', String(v ? seatsN - 1 : (parseInt(window.localStorage.getItem('gh_fp'), 10) || 2))); } catch (e) { } this.setState({ all: v }); },\n      demoText: this.state.all ? 'Demo: back to 2 friends paid' : 'Demo: show when all friends have paid'\n    };\n  }\n}\n"}, "Payment": {"tpl": "<div style=\"width:390px;height:844px;box-sizing:border-box;display:flex;flex-direction:column;background:#F4F5F8;color:#1B1D26;font-family:'DM Sans',system-ui,sans-serif;overflow:hidden\">\n Vals() {\n    return { amount: this.amount, payLabel: 'Pay ' + this.amount + ' with Navi UPI' };\n  }\n}\n"}, "PaymentDone": {"tpl": "<div style=\"width:390px;height:844px;box-sizing:border-box;display:flex;flex-direction:column;background:#FFFFFF;color:#1B1D26;font-family:'DM Sans',system-ui,sans-serif;overflow:hidden\">\n  <div style=\"flex:1 1 auto;min-height:0;overflow-y:auto;display:flex;flex-direction:column;align-items:center;padding:clamp(24px,8vh,96px) 24px 16px;gap:14px\">\n    <div style=\"width:96px;height:96px;border-radius:48px;background:#E3F3E9;display:flex;align-items:center;justify-content:center\">\n      <div style=\"width:68px;height:68px;border-radius:34px;background:#1F9D55;display:flex;align-items:center;justify-content:center\"><svg width=\"36\" height=\"36\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#FFFFFF\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M5 12.500l4.500 4.500L19 7.500\"/><\/svg><\/div>\n    <\/div>\n    <span style=\"font-size:24px;font-weight:700;margin-top:8px\">{{title}}<\/span>\n    <sc-if value=\"{{hasPay}}\" hint-placeholder-val=\"{{ true }}\">\n      <span style=\"font-size:36px;font-weight:700\">{{amount}}<\/span>\n      <span style=\"font-size:14px;color:#4A4E5C\">Paid with Navi UPI<\/span>\n    <\/sc-if>\n    <sc-if value=\"{{noPay}}\" hint-placeholder-val=\"{{ false }}\">\n      <span style=\"font-size:14px;color:#4A4E5C\">Your hold deposit covered your seat. Nothing more to pay.<\/span>\n    <\/sc-if>\n    <div style=\"width:100%;margin-top:18px;background:#F4F5F8;border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;box-sizing:border-box\">\n      <div style=\"display:flex;justify-content:space-between\"><span style=\"font-size:14px;color:#4A4E5C\">Booking<\/span><span style=\"font-size:14px;font-weight:500\">Night Ferry<\/span><\/div>\n      <div style=\"display:flex;justify-content:space-between\"><span style=\"font-size:14px;color:#4A4E5C\">Booking ID<\/span><span style=\"font-size:14px;font-weight:500\">BYS7K2NF<\/span><\/div>\n      <div style=\"display:flex;justify-content:space-between\"><span style=\"font-size:14px;color:#4A4E5C\">Transaction ID<\/span><span style=\"font-size:14px;font-weight:500\">T2611208841<\/span><\/div>\n    <\/div>\n    <sc-if value=\"{{hasRefund}}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"width:100%;background:#E3F3E9;border-radius:10px;padding:10px 12px;box-sizing:border-box\"><span style=\"font-size:14px;font-weight:700;color:#0F5F2F\">{{refundText}}<\/span><\/div>\n    <\/sc-if>\n    <div style=\"width:100%;background:#E3F3E9;border-radius:10px;padding:10px 12px;box-sizing:border-box\"><span style=\"font-size:14px;font-weight:500;color:#0F5F2F\">₹50 cashback will be credited in 24 hours.<\/span><\/div>\n  <\/div>\n  <div style=\"padding:16px 20px 28px;display:flex;flex-direction:column;gap:10px\">\n    <a href=\"Ticket.dc.html\" style=\"display:flex;align-items:center;justify-content:center;height:52px;border-radius:12px;background:#C72C4E;color:#FFFFFF;font-size:16px;font-weight:700\">View ticket<\/a>\n    <a href=\"Main.dc.html\" style=\"display:flex;align-items:center;justify-content:center;height:44px;font-size:14px;color:#4A4E5C\">Back to home<\/a>\n  <\/div>\n<\/div>", "code": "\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    let amount = '₹760.24', refund = 0, due = 1;\n    try {\n      const ls = window.localStorage;\n      if (ls.getItem('gh_mode') === 'hold') {\n        ls.setItem('gh_booked', '1'); ls.setItem('gh_paid', '0'); ls.removeItem('gh_end');\n        let n = 6, total = 2040, pct = 15;\n        const s = parseInt(ls.getItem('gh_seats'), 10); if (s >= 4 && s <= 8) n = s;\n        const t = parseInt(ls.getItem('gh_total'), 10); if (t > 0) total = t;\n        const q = parseInt(ls.getItem('gh_pct'), 10); if (q > 0) pct = q;\n        const rm = parseInt(window.localStorage.getItem('gh_re f=\"Hold.dc.html\" style=\"display:flex;align-items:center;justify-content:center;height:52px;border-radius:12px;background:#C72C4E;color:#FFFFFF;font-size:16px;font-weight:700\">Keep my hold<\/a>\n    <button onClick=\"{{openSure}}\" style=\"display:flex;align-items:center;justify-content:center;height:48px;border-radius:12px;border:2px solid #C72C4E;background:#FFFFFF;color:#C72C4E;font-family:inherit;font-size:15px;font-weight:700;text-align:center;cursor:pointer\">{{cancelLabel}}<\/button>\n  <\/div>\n  <sc-if value=\"{{sure}}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position:absolute;left:0;right:0;top:0;bottom:0;background:rgba(27,29,38,0.55);z-index:5;display:flex;flex-direction:column;justify-content:flex-end\">\n      <div style=\"background:#FFFFFF;border-radius:20px 20px 0 0;padding:24px 20px 28px;display:flex;flex-direction:column;gap:12px\">\n        <span style=\"font-size:20px;font-weight:700\">Are you sure?<\/span>\n        <span style=\"font-size:15px;color:#1B1D26\">{{sureText}}<\/span>\n        <span style=\"font-size:13px;color:#4A4E5C\">If your network drops while cancelling, check Your bookings before you try again. You will not be charged twice.<\/span>\n        <a href=\"CancelDone.dc.html\" onClick=\"{{confirm}}\" style=\"display:flex;align-items:center;justify-content:center;height:52px;border-radius:12px;background:#B3261E;color:#FFFFFF;font-size:16px;font-weight:700;margin-top:4px\">Yes, cancel hold<\/a>\n        <button onClick=\"{{closeSure}}\" style=\"height:52px;border-radius:12px;border:2px solid #C72C4E;background:#FFFFFF;color:#C72C4E;font-family:inherit;font-size:16px;font-weight:700;cursor:pointer\">No, keep my hold<\/button>\n      <\/div>\n    <\/div>\n  <\/sc-if>\n<\/div>", "code": "\nconst GH = {\n  hm: (ms) => { const d = new Date(ms); const h = d.getHours() % 12 === 0 ? 12 : d.getHours() % 12; const m = d.getMinutes(); return (h < 10 ? '0' : '') + h + ':' + (m < 10 ? '0' : '') + m + ' ' + (d.getHours() >= 12 ? 'PM' : 'AM'); }\n};\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    let n = 6, total = 2040, pct = 15, hrs = 1, fp = 2, end = 0;\n    try {\n      const ls = window.localStorage;\n      const s = parseInt(ls.getItem('gh_seats'), 10); if (s >= 4 && s <= 8) n = s;\n      const t = parseInt(ls.getItem('gh_total'), 10); if (t > 0) total = t;\n      const q = parseInt(ls.getItem('gh_pct'), 10); if (q > 0) pct = q;\n      const h = parseInt(ls.getItem('gh_len'), 10); if (h >= 1 && h <= 3) hrs = h;\n      const f = parseInt(ls.getItem('gh_fpaid'), 10); if (f >= 0) fp = f;\n      end = parseInt(ls.getItem('gh_end'), 10) || 0;\n    } catch (e) { }\n    const now = Date.now();\n    if (!(end > now)) { end = now + hrs * 3600000 - 1000; }\n    let lbl = 'F8 to F13'; try { const l = window.localStorage.getItem('gh_labels'); if (l) { lbl = l; } } catch (e) { }\n    this.cfg = { lbl: lbl, n: n, total: total, pct: pct, fp: Math.min(fp, n - 1), refundUntil: end - hrs * 3600000 + 20 * 60000 };\n    this.state = { flipped: false, sure: false };\n  }\n  renderVals() {\n    const c = this.cfg;\n    const open = false;\n    const deposit = Math.round(c.total * c.pct / 100);\n    const share = Math.round(c.total * 1.118 / c.n);\n    const friendsAmt = c.fp * share;\n    const cool = Date.now() + 3600000;\n    return {\n      seatsText: c.n + ' seats · PRIME - ' + c.lbl,\n      seatN: c.n,\n      pctText: c.pct + '%',\n      depositText: '₹' + deposit,\n      coolT: GH.hm(cool),\n      bannerText: open ? 'You are still inside the 20 minute refund window (till ' + GH.hm(c.refundUntil) + '). Cancel now and the full deposit comes back.' : 'If you cancel now, you lose your deposit.',\n      bannerStyle: 'padding:12px 14px;border-radius:12px;font-size:14px;font-weight:500;' + (open ? 'background:#E3F3E9;color:#0F5F2F' : 'background:#FFF4D6;border:1px solid #E8D38A;color:#4A3B00'),\n      resultLabel: open ? 'You get back' : 'You lose',\n      resultText: open ? '₹' + deposit : '₹' + deposit,\n      resultStyle: open ? 'color:#0F5F2F' : 'color:#B3261E',\n      resultNote: open ? 'It goes back to the account you paid from, usually in 3 to 5 working days.' : 'This is the ' + c.pct + '% you chose when you started the hold. All ' + c.n + ' seats are unbooked, so none of it is refunded.',\n      friendsText: c.fp > 0 ? c.fp + ' friends who already paid are refunded in full (₹' + friendsAmt + ' in total) and told the hold was cancelled.' : 'No friends have paid yet, so nobody else is charged.',\n      cancelLabel: open ? 'Cancel hold and get ₹' + deposit + ' back' : 'Cancel hold and lose ₹' + deposit,\n      sure: this.state.sure,\n      openSure: () => { this.setState({ sure: true }); },\n      closeSure: () => { this.setState({ sure: false }); },\n      sureText: open ? 'All ' + c.n + ' seats will be released and your ₹' + deposit + ' deposit will be refunded.' : 'All ' + c.n + ' seats will be released and you will lose your ₹' + deposit + ' deposit. This cannot be undone.',\n      flip: () => { this.setState({ flipped: !this.state.flipped }); },\n      flipText: open ? 'Demo' : 'Demo',\n      confirm: () => { try { const ls = window.localStorage; ls.setItem('gh_cool', String(Date.now() + 3600000)); ls.setItem('gh_cancel', open ? 'refund' : 'penalty'); ls.removeItem('gh_end'); ls.setItem('gh_paid', '0'); } catch (e) { } }\n    };\n  }\n}\n"}, "CancelDone": {"tpl": "<div style=\"width:390px;height:844px;box-sizing:border-box;display:flex;flex-direction:column;background:#FFFFFF;color:#1B1D26;font-family:'DM Sans',system-ui,sans-serif;overflow:hidden\">\n  <div style=\"flex:1 1 auto;min-height:0;overflow-y:auto;display:flex;flex-direction:column;align-items:center;padding:80px 24px 0;gap:14px\">\n    <div style=\"{{ringStyle}}\">\n      <div style=\"{{dotStyle}}\"><svg width=\"34\" height=\"34\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#FFFFFF\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria- or(props) {\n    super(props);\n    let n = 6, total = 2040, pct = 15, fp = 2, kind = 'refund', cool = Date.now() + 3600000;\n    try {\n      const ls = window.localStorage;\n      const s = parseInt(ls.getItem('gh_seats'), 10); if (s >= 4 && s <= 8) n = s;\n      const t = parseInt(ls.getItem('gh_total'), 10); if (t > 0) total = t;\n      const q = parseInt(ls.getItem('gh_pct'), 10); if (q > 0) pct = q;\n      const f = parseInt(ls.getItem('gh_fpaid'), 10); if (f >= 0) fp = f;\n      if (ls.getItem('gh_cancel') === 'penalty') kind = 'penalty';\n      const c = parseInt(ls.getItem('gh_cool'), 10); if (c > 0) cool = c;\n    } catch (e) { }\n    const d = new Date(cool); const h = d.getHours() % 12 === 0 ? 12 : d.getHours() % 12; const m = d.getMinutes();\n    this.v = { n: n, deposit: Math.round(total * pct / 100), pct: pct, fp: Math.min(fp, n - 1), kind: kind, coolT: (h < 10 ? '0' : '') + h + ':' + (m < 10 ? '0' : '') + m + ' ' + (d.getHours() >= 12 ? 'PM' : 'AM') };\n  }\n  renderVals() {\n    const v = this.v;\n    const pen = v.kind === 'penalty';\n    return {\n      amount: (pen ? '-₹' : '₹') + v.deposit,\n      amountStyle: '',\n      amtStyle: pen ? 'color:#B3261E' : 'color:#0F5F2F',\n      amountNote: pen ? 'Deposit kept (' + v.pct + '%). It is not refunded.' : 'Full deposit refunded to the account you paid from, usually in 3 to 5 working days.',\n      ringStyle: 'width:96px;height:96px;border-radius:48px;display:flex;align-items:center;justify-content:center;' + (pen ? 'background:#FBE4E2' : 'background:#E3F3E9'),\n      dotStyle: 'width:68px;height:68px;border-radius:34px;display:flex;align-items:center;justify-content:center;' + (pen ? 'background:#B3261E' : 'background:#1F9D55'),\n      seatsText: v.n + ' seats',\n      friendsText: v.fp > 0 ? v.fp + ' paid friends' : 'None paid',\n      coolT: v.coolT,\n      noteStyle: 'width:100%;border-radius:10px;padding:10px 12px;box-sizing:border-box;' + (pen ? 'background:#FFF4D6;color:#4A3B00' : 'background:#E // safe storage (falls back to memory if the browser blocks localStorage)
var store;
try{ var t='__gh_t'; window.localStorage.setItem(t,'1'); window.localStorage.removeItem(t); store=window.localStorage; }
catch(e){ var m={}; store={getItem:function(k){return Object.prototype.hasOwnProperty.call(m,k)?m[k]:null},setItem:function(k,v){m[k]=String(v)},removeItem:function(k){delete m[k]}}; }
var timers=[];
var W={localStorage:store,
  setInterval:function(f,t){var id=window.setInterval(f,t);timers.push(id);return id},
  clearInterval:function(id){window.clearInterval(id)}};
var phone=document.getElementById('phone');
function fit(){
  if(window.innerWidth<=500){phone.style.transform='';return}
  var k=Math.min(1,(window.innerHeight-48)/874,(window.innerWidth-48)/402);
  phone.style.transform='scale('+k+')';
}
window.addEventListener('resize',fit);fit();
var cur=null, inst=null, handlers=[], pending=false, curName=null;

function DCLogic(p){this.props=p||{}}
DCLogic.prototype.setState=function(o){
  Object.assign(this.state,typeof o==='function'?o(this.state):o);
  if(this===inst) schedule();
};
function schedule(){ if(pending) return; pending=true; Promise.resolve().then(function(){pending=false; if(inst) paint(false);}); }

function get(ctx,path){var p=path.split('.');var v=ctx[p[0]];for(var i=1;i<p.length;i++){v=v==null?undefined:v[p[i]]}return v}
function findClose(s,start,tag){var re=new RegExp('<(/?)'+tag+'\\b[^>]*>','g');re.lastIndex=start;var d=1,m;while((m=re.exec(s))){if(m[1]){d--;if(d===0)return{end:m.index,after:re.lastIndex}}else d++}throw new Error('no close '+tag)}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;')}
function sub(s,ctx){
  s=s.replace(/\s(disabled|checked|hidden|readonly|selected)="\{\{\s*([\w.]+)\s*\}\}"/g,function(_,a,k){return get(ctx,k)?' '+a:''});
  s=s.replace(/\son(Click|Change)="\{\{\s*([\w.]+)\s*\}\}"/g,function(_,ev,k){

  });
  return s.replace(/\{\{\s*([\w.]+)\s*\}\}/g,function(_,p){var v=get(ctx,p);return typeof v==='function'?'':(v==null?'':String(v))});
}
function render(tpl,ctx){
  var out='',i=0,re=/<(sc-if|sc-for)\b([^>]*)>/g,m;
  while((m=re.exec(tpl))){
    out+=sub(tpl.slice(i,m.index),ctx);
    var tag=m[1],c=findClose(tpl,re.lastIndex,tag),inner=tpl.slice(re.lastIndex,c.end),attrs=m[2];
    if(tag==='sc-if'){var k=/value="\{\{\s*([\w.]+)\s*\}\}"/.exec(attrs);var val=k?get(ctx,k[1]):false;if(val)out+=render(inner,ctx)}
    else{var l=/list="\{\{\s*([\w.]+)\s*\}\}"/.exec(attrs)[1],as=/as="(\w+)"/.exec(attrs)[1];(get(ctx,l)||[]).forEach(function(item){var n={};for(var q in ctx)n[q]=ctx[q];n[as]=item;out+=render(inner,n)})}
    i=c.after;re.lastIndex=c.after;

// minimal DOM morph so the 1-second timer never replaces a button mid-click
function morph(a,b){
  var i=0;
  while(i<b.childNodes.length){
    var nb=b.childNodes[i], na=a.childNodes[i];
    if(!na){a.appendChild(nb.cloneNode(true));i++;continue}
    if(na.nodeType!==nb.nodeType||na.nodeName!==nb.nodeName){a.replaceChild(nb.cloneNode(true),na);i++;continue}
    if(nb.nodeType===3){if(na.nodeValue!==nb.nodeValue)na.nodeValue=nb.nodeValue}
    else if(nb.nodeType===1){
      var j;
      for(j=na.attributes.length-1;j>=0;j--){var n=na.attributes[j].name;if(!nb.hasAttribute(n))na.removeAttribute(n)}
      for(j=0;j<nb.attributes.length;j++){var at=nb.attributes[j];if(na.getAttribute(at.name)!==at.value)na.setAttribute(at.name,at.value)}
      if(na.nodeName==='INPUT'&&na.type==='checkbox'){na.checked=nb.hasAttribute('checked')?true:na.checked}
      if(na.namespaceURI===nb.namespaceURI&&na.nodeName!=='svg'&&na.namespaceURI!=='http://www.w3.org/2000/svg')morph(na,nb);
      else if(na.outerHTML!==nb.outerHTML)a.replaceChild(nb.cloneNode(true),na);
    }
    i++;
  }
  while(a.childNodes.length>b.childNodes.length)a.removeChild(a.lastChild);
}
function paint(first){
  handlers=[];
  var html=render(cur.tpl,inst.renderVals());
  if(first){phone.innerHTML=html;return}
  var tmp=document.createElement('div');tmp.innerHTML=html;
  morph(phone,tmp);
}
function mount(name){
  timers.forEach(function(id){window.clearInterval(id)});timers=[];
  cur=SCREENS[name]; curName=name;
  var C=new Function('DCLogic','window',cur.code+';return Component')(DCLogic,W);
  inst=new C({});
  paint(true);
  var sc=phone.querySelectorAll('div');
  for(var i=0;i<sc.length;i++){if(sc[i].scrollTop)sc[i].scrollTop=0}
}
var LOWER={};Object.keys(SCREENS).forEach(function(k){LOWER[k.toLowerCase()]=k});
function screenFromHash(){var m=/^#(\w+)/.exec(location.hash);return m&&LOWER[m[1].toLowerCase()]?LOWER[m[1].toLowerCase()]:'Main'}
function go(name){
  if('#'+name.toLowerCase()===location.hash.toLowerCase()||(!location.hash&&name==='Main')){mount(name)}
  else{location.hash='#'+name.toLowerCase()}
}
window.addEventListener('hashchange',function(){mount(screenFromHash())});

function onEvent(e){
  var ev=e.type==='change'?'change':'click';
  var h=e.target.closest&&e.target.closest('[data-h'+ev+']');
  if(h&&phone.contains(h)){var f=handlers[+h.getAttribute('data-h'+ev)];if(f){try{f.call(inst,e)}catch(err){console.error(err)}}}
  if(ev==='click'){
    var a=e.target.closest&&e.target.closest('a[href]');
    if(a&&phone.contains(a)){
      var href=a.getAttribute('href')||'';var m=/^(\w+)\.dc\.html$/.exec(href);
      if(m&&SCREENS[m[1]]){e.preventDefault();go(m[1])}
    }
  }
}
phone.addEventListener('click',onEvent);
phone.addEventListener('change',onEvent);
mount(screenFromHash());
})();
